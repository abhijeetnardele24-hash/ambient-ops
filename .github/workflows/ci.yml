name: CI Workflow - Test & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Automated Tests, Playwright E2E & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit

      - name: Install Playwright Browsers & System Dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check backend/ tests/ --select E,F,W --ignore E501

      - name: Security Audit (Bandit)
        run: |
          bandit -r backend/ -s B101,B104

      - name: Run Pytest Suite with Coverage (>= 85% Target)
        run: |
          pytest --cov=backend --cov-report=term-missing --cov-fail-under=85 tests/ -v

      - name: Verify Docker Container Build
        run: |
          docker build -t ambient-ops:ci .
