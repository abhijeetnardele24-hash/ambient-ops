name: CI Workflow - Test & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Automated Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run Pytest with Measured Coverage
        run: |
          pytest --cov=backend --cov-report=term-missing --cov-fail-under=85 tests/ -v

      - name: Security Linting (Bandit)
        run: |
          pip install bandit
          bandit -r backend/ -s B101,B104
